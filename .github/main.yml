name: Main Branch Flow
run-name: ${{ github.actor }} is running GitHub Actions From Main Branch Flow
on: 
  push:
    branches:
      - main
jobs:
  job-1:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Build TamAnVui Website
        run: docker compose up -d
